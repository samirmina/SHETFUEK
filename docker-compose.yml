services:
  native-host:
    build:
      context: .
      dockerfile: extension/native-host/Dockerfile
    container_name: zendesk-fm-native-host
    ports:
      - "27183:27183"
    environment:
      HTTP_PORT: "27183"
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "llama3.2:3b"
      OLLAMA_TIMEOUT_MS: "120000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./extension:/app/extension
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:27183/api/ping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'ping'})}).then(r=>r.json()).then(d=>process.exit(d.success?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
